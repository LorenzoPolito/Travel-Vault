<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky-it" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b0d"/>
      <stop offset="100%" stop-color="#1a2e1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#sky-it)"/>
  <!-- Stars -->
  <circle cx="60" cy="35" r="1.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="180" cy="20" r="1" fill="rgba(255,255,255,0.2)"/>
  <circle cx="340" cy="40" r="1.5" fill="rgba(255,255,255,0.2)"/>
  <!-- Colosseum base -->
  <ellipse cx="200" cy="270" rx="110" ry="18" fill="rgba(255,255,255,0.03)"/>
  <!-- Colosseum outer wall -->
  <path d="M95 270 L95 110 Q95 75 200 75 Q305 75 305 110 L305 270" stroke="rgba(255,255,255,0.15)" stroke-width="2.5" fill="rgba(255,255,255,0.03)"/>
  <!-- Colosseum top rim -->
  <rect x="90" y="90" width="220" height="8" rx="3" fill="rgba(255,255,255,0.12)"/>
  <!-- Colosseum arches - row 1 (top) -->
  <rect x="125" y="115" width="20" height="35" rx="10" fill="rgba(255,255,255,0.07)"/>
  <rect x="160" y="115" width="20" height="35" rx="10" fill="rgba(255,255,255,0.07)"/>
  <rect x="195" y="115" width="20" height="35" rx="10" fill="rgba(255,255,255,0.07)"/>
  <rect x="230" y="115" width="20" height="35" rx="10" fill="rgba(255,255,255,0.07)"/>
  <rect x="265" y="115" width="20" height="35" rx="10" fill="rgba(255,255,255,0.07)"/>
  <!-- Colosseum arches - row 2 -->
  <rect x="135" y="165" width="20" height="35" rx="10" fill="rgba(255,255,255,0.05)"/>
  <rect x="170" y="165" width="20" height="35" rx="10" fill="rgba(255,255,255,0.05)"/>
  <rect x="205" y="165" width="20" height="35" rx="10" fill="rgba(255,255,255,0.05)"/>
  <rect x="240" y="165" width="20" height="35" rx="10" fill="rgba(255,255,255,0.05)"/>
  <!-- Colosseum arches - row 3 (bottom) -->
  <rect x="145" y="215" width="20" height="30" rx="10" fill="rgba(255,255,255,0.04)"/>
  <rect x="180" y="215" width="20" height="30" rx="10" fill="rgba(255,255,255,0.04)"/>
  <rect x="215" y="215" width="20" height="30" rx="10" fill="rgba(255,255,255,0.04)"/>
  <rect x="250" y="215" width="20" height="30" rx="10" fill="rgba(255,255,255,0.04)"/>
  <!-- Ground -->
  <rect x="0" y="280" width="400" height="40" fill="rgba(255,255,255,0.03)"/>
  <!-- Cyprus tree left -->
  <path d="M40 280 L48 230 L56 280Z" fill="rgba(255,255,255,0.04)"/>
  <path d="M35 260 L48 210 L61 260Z" fill="rgba(255,255,255,0.03)"/>
  <!-- Cyprus tree right -->
  <path d="M345 280 L353 240 L361 280Z" fill="rgba(255,255,255,0.04)"/>
  <path d="M340 265 L353 225 L366 265Z" fill="rgba(255,255,255,0.03)"/>
</svg>
