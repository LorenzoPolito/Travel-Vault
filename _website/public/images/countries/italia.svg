  <!-- Colosseum top rim -->
  <rect x="105" y="85" width="190" height="8" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Colosseum arches - row 1 -->
  <rect x="130" y="110" width="18" height="30" rx="9" fill="rgba(255,255,255,0.08)"/>
  <rect x="160" y="110" width="18" height="30" rx="9" fill="rgba(255,255,255,0.08)"/>
  <rect x="190" y="110" width="18" height="30" rx="9" fill="rgba(255,255,255,0.08)"/>
  <rect x="220" y="110" width="18" height="30" rx="9" fill="rgba(255,255,255,0.08)"/>
  <rect x="250" y="110" width="18" height="30" rx="9" fill="rgba(255,255,255,0.08)"/>
  <!-- Colosseum arches - row 2 -->
  <rect x="140" y="155" width="18" height="30" rx="9" fill="rgba(255,255,255,0.06)"/>
