  <rect x="180" y="200" width="18" height="25" rx="9" fill="rgba(255,255,255,0.05)"/>
  <rect x="210" y="200" width="18" height="25" rx="9" fill="rgba(255,255,255,0.05)"/>
  <rect x="240" y="200" width="18" height="25" rx="9" fill="rgba(255,255,255,0.05)"/>
