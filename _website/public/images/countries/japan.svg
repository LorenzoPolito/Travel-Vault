  <circle cx="200" cy="130" r="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Torii gate -->
  <rect x="170" y="150" width="60" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="165" y="157" width="70" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="185" y="161" width="4" height="90" fill="rgba(255,255,255,0.15)"/>
  <rect x="211" y="161" width="4" height="90" fill="rgba(255,255,255,0.15)"/>
  <rect x="170" y="245" width="60" height="5" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Cherry blossom branch -->
  <path d="M10 100 Q80 60 200 90" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>
  <circle cx="80" cy="65" r="4" fill="rgba(255,183,197,0.2)"/>
  <circle cx="85" cy="58" r="3" fill="rgba(255,183,197,0.15)"/>
  <circle cx="180" cy="80" r="4" fill="rgba(255,183,197,0.2)"/>
  <circle cx="185" cy="73" r="3" fill="rgba(255,183,197,0.15)"/>
</svg>
