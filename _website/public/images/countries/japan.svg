<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky-jp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#sky-jp)"/>
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="120" cy="50" r="1" fill="rgba(255,255,255,0.2)"/>
  <circle cx="300" cy="25" r="1.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="350" cy="60" r="1" fill="rgba(255,255,255,0.15)"/>
  <circle cx="200" cy="15" r="1" fill="rgba(255,255,255,0.2)"/>
  <!-- Moon -->
  <circle cx="310" cy="45" r="16" fill="rgba(255,255,255,0.06)"/>
  <circle cx="316" cy="45" r="14" fill="url(#sky-jp)"/>
  <!-- Mt Fuji base -->
  <path d="M80 300 L200 60 L320 300" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Mt Fuji snow cap -->
  <path d="M188 90 L200 60 L212 90 Q200 85 188 90Z" fill="rgba(255,255,255,0.15)"/>
  <!-- Torii gate large -->
  <rect x="155" y="120" width="90" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="148" y="130" width="104" height="5" rx="2" fill="rgba(255,255,255,0.18)"/>
  <rect x="172" y="136" width="6" height="130" fill="rgba(255,255,255,0.1)"/>
  <rect x="222" y="136" width="6" height="130" fill="rgba(255,255,255,0.1)"/>
  <rect x="155" y="260" width="90" height="5" rx="2" fill="rgba(255,255,255,0.1)"/>
  <!-- Cherry blossom branch -->
  <path d="M0 185 Q60 175 130 195 Q160 202 200 190" stroke="rgba(255,183,197,0.12)" stroke-width="2.5" fill="none"/>
  <circle cx="50" cy="177" r="5" fill="rgba(255,183,197,0.15)"/>
  <circle cx="56" cy="170" r="4" fill="rgba(255,183,197,0.1)"/>
  <circle cx="130" cy="192" r="5" fill="rgba(255,183,197,0.12)"/>
  <circle cx="136" cy="185" r="3.5" fill="rgba(255,183,197,0.08)"/>
  <circle cx="185" cy="186" r="4" fill="rgba(255,183,197,0.1)"/>
  <!-- Ground -->
  <rect x="0" y="280" width="400" height="40" fill="rgba(255,255,255,0.03)"/>
  <!-- Pine tree -->
  <path d="M60 280 L70 240 L80 280Z" fill="rgba(255,255,255,0.04)"/>
  <path d="M55 260 L70 220 L85 260Z" fill="rgba(255,255,255,0.03)"/>
  <path d="M320 280 L330 250 L340 280Z" fill="rgba(255,255,255,0.04)"/>
  <path d="M315 265 L330 235 L345 265Z" fill="rgba(255,255,255,0.03)"/>
</svg>
