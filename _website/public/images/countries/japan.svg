<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Mt Fuji -->
  <path d="M120 280 L200 80 L280 280" stroke="white" stroke-width="3" opacity="0.3" fill="rgba(255,255,255,0.05)"/>
  <!-- Snow cap -->
  <path d="M192 110 L200 80 L208 110 Q200 105 192 110Z" fill="rgba(255,255,255,0.2)"/>
