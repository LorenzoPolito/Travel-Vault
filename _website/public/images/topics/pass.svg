<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="sky-pa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="100%" stop-color="#2e1a2e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#sky-pa)"/>
  <!-- Ticket body -->
  <rect x="40" y="100" width="320" height="140" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Perforation line -->
  <circle cx="200" cy="100" r="12" fill="url(#sky-pa)"/>
  <circle cx="200" cy="240" r="12" fill="url(#sky-pa)"/>
  <!-- Ticket text lines -->
  <rect x="60" y="130" width="120" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="60" y="150" width="180" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="60" y="170" width="100" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
  <!-- Barcode on right side -->
  <rect x="270" y="120" width="4" height="80" fill="rgba(255,255,255,0.08)"/>
  <rect x="278" y="120" width="2" height="80" fill="rgba(255,255,255,0.06)"/>
  <rect x="284" y="120" width="5" height="80" fill="rgba(255,255,255,0.07)"/>
  <rect x="293" y="120" width="2" height="80" fill="rgba(255,255,255,0.05)"/>
  <rect x="299" y="120" width="3" height="80" fill="rgba(255,255,255,0.06)"/>
  <rect x="306" y="120" width="5" height="80" fill="rgba(255,255,255,0.07)"/>
  <rect x="315" y="120" width="2" height="80" fill="rgba(255,255,255,0.05)"/>
  <!-- Stub cut mark -->
  <path d="M200 88 L200 100" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M200 240 L200 252" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
</svg>
